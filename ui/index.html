<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo: play a bot that talks back</title>
<meta name="description" content="Play a chess bot that learns your style and comments on the game.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f6670'/%3E%3Ctext x='32' y='47' font-size='44' text-anchor='middle' fill='%23fbf8ef'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<noscript><p class="noscript">This page needs JavaScript to show the board.</p></noscript>
<main class="table">
  <section class="board-col" aria-label="Board">
    <div class="topline">
      <div class="statusbox">
        <p class="status" id="status" role="status"></p>
        <p class="opening" id="opening" hidden></p>
      </div>
      <div class="captured" id="capTop"></div>
    </div>
    <div class="board" id="board" role="group" aria-label="Chess board"></div>
    <div class="captured" id="capBottom"></div>
    <nav class="nav" aria-label="Move through the game">
      <button type="button" id="navFirst" aria-label="First position" title="First position (Home)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-7 6 7 6M12 6l-7 6 7 6"/></svg></button>
      <button type="button" id="navPrev" aria-label="Previous move" title="Previous move (Left arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" id="navHint" class="hint-btn" aria-pressed="false" title="Show the engine's best move" hidden>Hint</button>
      <button type="button" id="navNext" aria-label="Next move" title="Next move (Right arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button type="button" id="navLast" aria-label="Back to the game" title="Back to the game (End)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l7 6-7 6M12 6l7 6-7 6"/></svg></button>
    </nav>
    <div class="controls">
      <button class="btn primary" id="newBtn">New game</button>
      <button class="btn" id="undoBtn">Take back</button>
      <button class="btn" id="flipBtn">Flip board</button>
      <button class="btn" id="resignBtn">Resign</button>
    </div>
  </section>

  <aside class="side">
    <section class="opponent" aria-label="Opponent">
      <div class="who">
        <div class="avatar" id="avatar" aria-hidden="true">&#9822;</div>
        <div><h1 id="botName">Echo</h1><p id="botBlurb"></p></div>
        <button type="button" class="practice" id="practiceBtn" role="switch" aria-checked="false"
                title="Signs on every move, a hint button, and a prompt to learn from mistakes">Practice</button>
      </div>
      <details class="settings" id="settings" open>
        <summary><span>Game settings</span><span class="now" id="settingsNow"></span></summary>
        <div class="settings-body">
          <fieldset>
            <legend>Opponent</legend>
            <div class="seg" id="botSeg" role="radiogroup" aria-label="Opponent"></div>
          </fieldset>
          <fieldset>
            <legend>Strength</legend>
            <div class="seg" id="dialSeg" role="radiogroup" aria-label="Strength">
              <button role="radio" data-dial="faithful" title="Plays most like the profile; allows small inaccuracies">Faithful</button>
              <button role="radio" data-dial="balanced" title="Profile style with fewer slips">Balanced</button>
              <button role="radio" data-dial="sharp" title="Near-perfect play; style only breaks ties">Sharp</button>
            </div>
            <p class="hint" id="dialHint"></p>
          </fieldset>
          <fieldset>
            <legend>You play</legend>
            <div class="seg" id="colorSeg" role="radiogroup" aria-label="Your color">
              <button role="radio" data-color="white">White</button>
              <button role="radio" data-color="black">Black</button>
            </div>
            <p class="hint">Opponent, strength and color apply to the next new game.</p>
          </fieldset>
        </div>
      </details>
    </section>

    <section class="chat" id="chat" aria-live="polite" aria-label="Bot commentary"></section>

    <section class="sheet" aria-label="Scoresheet">
      <h2>Scoresheet</h2>
      <div id="sheet"></div>
    </section>
  </aside>
</main>

<div class="toast" id="toast" role="status"></div>
<dialog id="promo"><div>Promote to</div><div class="pick" id="promoPick"></div></dialog>
<dialog id="confirm">
  <form method="dialog">
    <p>Resign this game?</p>
    <div class="actions">
      <button class="btn" value="cancel">Keep playing</button>
      <button class="btn primary" value="resign" id="confirmYes">Resign</button>
    </div>
  </form>
</dialog>

<dialog id="code">
  <form method="dialog" id="codeForm" autocomplete="off">
    <p>Got a code?</p>
    <input type="text" id="codeInput" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"
           enterkeyhint="go" maxlength="40" aria-label="Code">
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate>Close</button>
      <button class="btn primary" value="go" id="codeGo">Go</button>
    </div>
  </form>
</dialog>

<script src="/app.js" defer></script>
</body>
</html>
